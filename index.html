<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกข้อมูล Cathodic Protection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 600px;">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white text-center">
        <h4>บันทึกข้อมูล Cathodic Protection</h4>
      </div>
      <div class="card-body">
        
        <!-- ส่วนสแกน QR Code แบบกล้องสด -->
        <div class="mb-3 text-center">
          <label class="form-label fw-bold">1. สแกน QR Code จุดวัด</label>
          <div id="reader" style="width: 100%;"></div>
          <button type="button" class="btn btn-outline-secondary btn-sm mt-2 w-100" id="btn-rescan" style="display:none;" onclick="startScanner()">สแกนใหม่อีกครั้ง</button>
        </div>

        <form id="cpForm" onsubmit="submitForm(event)">
          <div class="mb-3">
            <label class="form-label">Station ID</label>
            <input type="text" class="form-control" id="station_id" required readonly placeholder="รอสแกน QR Code...">
          </div>
          <div class="mb-3">
            <label class="form-label">Location / กม.</label>
            <input type="text" class="form-control" id="location" readonly placeholder="รอสแกน QR Code...">
          </div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" id="type">
              <option value="">-- เลือกประเภท --</option>
              <option value="DB">DB</option>
              <option value="BR">BR</option>
            </select>
          </div>
          
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Von PTT (Vdc)</label>
              <input type="number" step="any" class="form-control" id="von_ptt">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Voff PTT (Vdc)</label>
              <input type="number" step="any" class="form-control" id="voff_ptt">
            </div>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Von Foreign (Vdc)</label>
              <input type="number" step="any" class="form-control" id="von_foreign">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Voff Foreign (Vdc)</label>
              <input type="number" step="any" class="form-control" id="voff_foreign">
            </div>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">I (Adc)</label>
              <input type="number" step="any" class="form-control" id="current_adc">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">I (Aac)</label>
              <input type="number" step="any" class="form-control" id="current_aac">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Direction</label>
            <div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="direction" id="dir_in" value="in">
                <label class="form-check-label" for="dir_in">in</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="direction" id="dir_out" value="out">
                <label class="form-check-label" for="dir_out">out</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Resistor (Ohm)</label>
            <input type="text" class="form-control" id="resistor" placeholder="เช่น 30w/5">
          </div>

          <div class="mb-3">
            <label class="form-label">Remark (หมายเหตุ)</label>
            <textarea class="form-control" id="remark" rows="2"></textarea>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2" id="submitBtn">บันทึกข้อมูล</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let html5QrcodeScanner;

    function onScanSuccess(decodedText, decodedResult) {
      let arr = decodedText.split('|');
      document.getElementById('station_id').value = arr[0] || decodedText;
      document.getElementById('location').value = arr[1] || '';
      
      html5QrcodeScanner.clear().then(_ => {
        document.getElementById('btn-rescan').style.display = 'block';
      }).catch(error => {
        console.error("Failed to clear scanner. ", error);
      });
    }

    function startScanner() {
      document.getElementById('btn-rescan').style.display = 'none';
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: { width: 250, height: 250 } });
      html5QrcodeScanner.render(onScanSuccess);
    }

    window.onload = function() {
      startScanner();
    };

    function submitForm(e) {
      e.preventDefault();
      
      let selectedDir = document.querySelector('input[name="direction"]:checked');

      let data = {
        station_id: document.getElementById('station_id').value,
        location: document.getElementById('location').value,
        type: document.getElementById('type').value,
        von_ptt: document.getElementById('von_ptt').value,
        voff_ptt: document.getElementById('voff_ptt').value,
        von_foreign: document.getElementById('von_foreign').value,
        voff_foreign: document.getElementById('voff_foreign').value,
        current_adc: document.getElementById('current_adc').value,
        current_aac: document.getElementById('current_aac').value,
        direction: selectedDir ? selectedDir.value : '',
        resistor: document.getElementById('resistor').value,
        remark: document.getElementById('remark').value
      };

      if(!data.station_id) {
        alert('กรุณาสแกน QR Code ก่อนบันทึกข้อมูล');
        return;
      }

      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').innerText = 'กำลังบันทึก...';

      // ** แทนที่ URL ด้านล่างนี้ด้วย URL ของ Apps Script Web App อันเดิมของคุณ **
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbziglsr6a2yo733gVfsZM4X-0HbSVqpkzZO3xmah8401jDPqARbtnNNo4ritzOznwlKRQ/exec";

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(response => {
        alert('บันทึกข้อมูลสำเร็จ!');
        document.getElementById('cpForm').reset();
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').innerText = 'บันทึกข้อมูล';
        startScanner();
      })
      .catch(error => {
        alert('เกิดข้อผิดพลาด: ' + error);
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').innerText = 'บันทึกข้อมูล';
      });
    }
  </script>
</body>
</html>
